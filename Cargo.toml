[workspace]
resolver = "2"
members = ["crates/yomi-core", "crates/yomi-viewer", "crates/yomi-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/Champloot/yomi"
authors = ["Artem <you@example.com>"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Профиль релиза: главный приоритет — размер и скорость запуска бинарника.
[profile.release]
opt-level = 3
lto = "fat"        # оптимизация на этапе линковки между крейтами
codegen-units = 1  # медленнее собирается, но код быстрее
strip = true       # убрать отладочные символы
panic = "abort"    # без раскрутки стека: меньше размер
