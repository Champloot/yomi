# Настройки cargo-deny: проверка лицензий и уязвимостей зависимостей.
# Запуск: cargo deny check

[licenses]
# Разрешены только разрешительные лицензии. Копилефт (GPL, AGPL) в
# зависимостях означал бы, что проект обязан распространяться на тех же
# условиях, а он под MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
# SQLite — общественное достояние; в реестре помечен как таковой.
name = "libsqlite3-sys"
allow = ["MIT", "Apache-2.0", "blessing"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
# Уязвимости в зависимостях — ошибка сборки, а не примечание.
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
