name: Release

# Запускается по тегу вида v0.1.0. Собирает статические бинарники и
# прикладывает их к релизу на GitHub.
on:
  push:
    tags: ["v*"]
  # Ручной запуск — чтобы проверить сборку, не создавая тега.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v5

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross вместо ручной сборки тулчейна. Причина: у yomi есть
      # зависимость с C-кодом (rusqlite/bundled), и кросс-компиляция
      # такого кода под musl требует настоящего musl-тулчейна для
      # целевой архитектуры, а не glibc-кросс-компилятора — тот
      # линкуется против других заголовков и стартовых объектов и
      # падает с ошибкой линковки. cross тянет Docker-образ с уже
      # настроенным окружением под каждый target.
      - name: Установка cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Сборка
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Сведения о бинарнике
        run: file target/${{ matrix.target }}/release/yomi

      # Полноценно проверить статичность и запустить бинарник можно
      # только на своей архитектуре: aarch64-бинарник на x86_64-раннере
      # не выполнится без эмуляции. Строгую проверку (ldd, --version)
      # оставляем x86_64; для aarch64 удовлетворяемся тем, что file
      # опознаёт верную архитектуру и формат ELF.
      - name: Проверка статичности и запуска (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -e
          bin=target/${{ matrix.target }}/release/yomi
          # Разные версии ldd сообщают об одном и том же по-разному:
          # "not a dynamic executable" или "statically linked" — оба
          # означают, что бинарник статический. Первая проверка искала
          # только первую формулировку и валила предупреждением
          # заведомо статический бинарник — проверено вручную на
          # реальном выводе из этого же CI.
          if ldd "$bin" 2>&1 | grep -Eqi "not a dynamic|statically linked"; then
            echo "бинарник статический"
          else
            echo "::warning::бинарник не полностью статический — проверьте зависимости:"
            ldd "$bin" || true
          fi
          "$bin" --version

      - name: Сборка архива
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="dev"
          name="yomi-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"

          cp target/${{ matrix.target }}/release/yomi "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"

          # Автодополнение и man генерируются самим бинарником, поэтому
          # не могут разойтись со справкой. Собираем хостовую (x86_64)
          # копию: запускать чужую архитектуру здесь нечем, а вывод
          # генератора от архитектуры не зависит.
          cargo build --release --locked
          mkdir -p "dist/$name/completions"
          for shell in bash zsh fish; do
            ./target/release/yomi generate completions "$shell" \
              > "dist/$name/completions/yomi.$shell"
          done
          ./target/release/yomi generate manpage > "dist/$name/yomi.1"

          tar -czf "dist/${name}.tar.gz" -C dist "$name"
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    name: Публикация релиза
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Создание релиза
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
