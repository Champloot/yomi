[package]
name = "yomi-source-mangadex"
description = "Источник MangaDex: поиск, главы, страницы"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

exclude = ["tests/"]

[dependencies]
yomi-core = { path = "../yomi-core" }
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json = "1.0"
async-trait.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
# rustls вместо native-tls: не тянет системный OpenSSL, что важно для
# статической сборки под musl (см. разговор о совместимости дистрибутивов).
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "gzip"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
