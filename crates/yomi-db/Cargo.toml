[package]
name = "yomi-db"
description = "Хранилище yomi: библиотека, метаданные, прогресс чтения"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
yomi-core = { path = "../yomi-core" }
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json = "1.0"
# bundled: SQLite компилируется внутрь бинарника, на машине пользователя
# ставить ничего не нужно. Цена — время сборки.
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
