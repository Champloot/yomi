[package]
name = "yomi"
description = "Терминальная читалка манги для Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Cargo пакует только содержимое каталога крейта, поэтому docs/ и
# прочее из корня репозитория сюда не попадает само по себе. Явно
# исключаем лишь тесты — потребителю пакета они не нужны.
exclude = ["tests/"]

# Имя исполняемого файла — короткое: пользователь набирает его руками.
[[bin]]
name = "yomi"
path = "src/main.rs"

[dependencies]
yomi-core = { path = "../yomi-core" }
yomi-viewer = { path = "../yomi-viewer" }
yomi-db = { path = "../yomi-db" }
yomi-download = { path = "../yomi-download" }
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
# Только ради восстановления обработки SIGPIPE по умолчанию.
libc = "0.2"
clap_complete = "4.5"
clap_mangen = "0.2"

[dev-dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }
image = { version = "0.24", default-features = false, features = ["png"] }
which = "6"
